name: Windows Test Build

# A private test build for checking a change on a real PC before it ships.
# It never reaches users:
#   - It runs only on test-build/** branches (or by hand), never on a v* tag,
#     so release.yml does not run.
#   - The app finds updates only through version.json on main. This job has
#     read-only access to the repo, so it cannot push version.json or create a
#     release even by mistake.
#   - The build is a workflow artifact (a zip on the run's page), not a release
#     asset, and it is deleted after 3 days.

on:
  push:
    branches:
      - 'test-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3

      # Security tests that need a real Windows machine (Mark of the Web).
      - name: Run Windows security tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        # Failures are echoed as annotations, which the run page shows even to
        # someone not signed in to GitHub (the full log needs a login).
        run: |
          set +e
          python -m pytest -q -rfE tests/test_attachment_safety.py tests/test_sandbox.py tests/test_account_transfer.py > pytest.txt 2>&1
          rc=$?
          cat pytest.txt
          grep -E '^(FAILED|ERROR)' pytest.txt | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          exit $rc

      - name: Build executable
        run: python -m PyInstaller AMail.spec --noconfirm

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: AMail-TEST-${{ github.sha }}
          path: dist/AMail/
          retention-days: 3
