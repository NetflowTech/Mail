name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller AMail.spec --noconfirm

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: |
          mkdir installer_output
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Compute SHA256
        id: sha256
        shell: pwsh
        run: |
          $file = "installer_output\AMail-Setup-${{ steps.ver.outputs.version }}.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          echo "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Update version.json
        shell: pwsh
        run: |
          $json = [ordered]@{
            version  = "${{ steps.ver.outputs.version }}"
            win_url  = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AMail-Setup-${{ steps.ver.outputs.version }}.exe"
            win_sha256 = "${{ steps.sha256.outputs.hash }}"
          } | ConvertTo-Json
          $json | Set-Content version.json -Encoding UTF8

      - name: Commit version.json back to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Update version.json for ${{ github.ref_name }}"
          git push origin HEAD:main

      - name: Create GitHub release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AMail ${{ steps.ver.outputs.version }}
          files: installer_output/AMail-Setup-${{ steps.ver.outputs.version }}.exe
