name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # The release notes are the annotated tag's message
      # (git tag -a vX.Y.Z -m "..."). They go into version.json ("notes", shown
      # in the in-app update prompt) and onto the GitHub release page. A
      # lightweight tag gives empty notes and the app shows its default line.
      # The text is handled only through files and environment variables,
      # never pasted into a script, so a tag message cannot run commands here.
      # The app reports its version from emailclient/__init__.py. If it doesn't
      # match the tag, every installed copy would think it's out of date and
      # offer the same update again forever, so stop before building.
      - name: Check the app version matches the tag
        shell: bash
        run: |
          app=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' emailclient/__init__.py)
          if [ "$app" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::emailclient/__init__.py says $app but the tag is ${GITHUB_REF_NAME}. Bump __version__ and tag again."
            exit 1
          fi

      - name: Read release notes from the tag
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          : > release_notes.txt
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ]; then
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" \
              | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' \
              | head -n 12 > release_notes.txt
          fi
          echo "--- release notes ---"; cat release_notes.txt; echo "---"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3

      - name: Build executable
        run: python -m PyInstaller AMail.spec --noconfirm

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: |
          mkdir installer_output
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer.iss

      - name: Compute SHA256
        id: sha256
        shell: pwsh
        run: |
          $file = "installer_output\AMail-Setup-${{ steps.ver.outputs.version }}.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          echo "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AMail ${{ steps.ver.outputs.version }}
          body_path: release_notes.txt
          files: installer_output/AMail-Setup-${{ steps.ver.outputs.version }}.exe

      # The signing server (sign_release.ps1, every 5 minutes) sees the new release,
      # signs the installer with minisign -t "version:X.Y.Z" and uploads the .minisig.
      # version.json is what makes installed copies offer the update, and the app
      # refuses an update whose signature is missing or made for another version, so
      # version.json must not go live before the signature exists and checks out.
      - name: Wait for the signing server's .minisig
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sig="AMail-Setup-${{ steps.ver.outputs.version }}.exe.minisig"
          for i in $(seq 1 60); do
            if gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$sig"; then
              echo "signature found after about $((i * 30)) seconds"
              gh release download "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --pattern "$sig" --dir installer_output --clobber
              exit 0
            fi
            sleep 30
          done
          echo "::error::No $sig on the release after 30 minutes. Check the signing server (sign_release.ps1 task, gh auth). version.json was NOT updated, so nobody is offered this build yet. Once the .minisig is uploaded, re-run only this job's failed steps (Re-run failed jobs), or sign by hand and commit version.json yourself."
          exit 1

      - name: Verify the signature the way the app will
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from emailclient import updater
          v = "${{ steps.ver.outputs.version }}"
          exe = Path(f"installer_output/AMail-Setup-{v}.exe")
          ok = updater._verify_minisign(exe, Path(str(exe) + ".minisig"), version=v)
          if not ok:
              raise SystemExit(f"::error::signature check failed: {updater.last_failure()}. "
                               "Is sign_release.ps1 using -t \"version:$version\"? version.json was NOT updated.")
          print("signature verifies and is bound to version", v)
          PY

      - name: Update version.json
        shell: pwsh
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AMail-Setup-${{ steps.ver.outputs.version }}.exe"
          $notes = (Get-Content release_notes.txt -Raw -Encoding UTF8)
          if ($null -eq $notes) { $notes = "" }
          # Cap in PowerShell, where strings are Unicode: a byte cut in bash
          # could split a character. The app caps again when it shows them.
          if ($notes.Length -gt 1200) { $notes = $notes.Substring(0, 1200) }
          $json = [ordered]@{
            version    = "${{ steps.ver.outputs.version }}"
            win_url    = $base
            win_sha256 = "${{ steps.sha256.outputs.hash }}"
            win_sig_url = "$base.minisig"
            notes      = $notes.Trim()
          } | ConvertTo-Json
          $json | Set-Content version.json -Encoding UTF8

      # This is the moment the update goes live for every installed copy.
      - name: Commit version.json back to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Update version.json for ${{ github.ref_name }}"
          # main may have moved while we waited for the signature
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
