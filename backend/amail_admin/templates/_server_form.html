<form method="post" action="{{ url_for('settings_server') }}" class="form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="wide">Address PCs use to reach this server <input name="public_url" value="{{ public_url }}" placeholder="https://192.168.1.20:8443" required></label>
  <label class="wide check"><input type="checkbox" name="pin" value="1" {% if pin %}checked{% endif %}> PCs trust only this server's own certificate. Leave on, unless a tunnel or proxy with its own certificate sits in front of the server.</label>
  <div class="wide"><button class="primary">Save</button></div>
</form>
